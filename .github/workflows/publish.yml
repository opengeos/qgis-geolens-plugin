name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      # Only a boolean reaches job scope; the secrets themselves stay on the
      # upload step so the packaging code cannot read them.
      HAS_QGIS_CREDENTIALS: ${{ secrets.QGIS_PLUGIN_REPO_USERNAME != '' && secrets.QGIS_PLUGIN_REPO_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python package_plugin.py --output dist/geolens_qgis.zip
      - name: Verify metadata version
        run: |
          metadata_version=$(grep '^version=' geolens_qgis/metadata.txt | cut -d= -f2 | tr -d '[:space:]')
          test "$metadata_version" = "${TAG#v}"
      - name: Attach package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" dist/geolens_qgis.zip --clobber
      - name: Upload to QGIS Plugins
        if: env.HAS_QGIS_CREDENTIALS == 'true'
        env:
          QGIS_PLUGIN_REPO_USERNAME: ${{ secrets.QGIS_PLUGIN_REPO_USERNAME }}
          QGIS_PLUGIN_REPO_PASSWORD: ${{ secrets.QGIS_PLUGIN_REPO_PASSWORD }}
        run: python scripts/upload_to_qgis_plugin_repo.py dist/geolens_qgis.zip
